services:
  db:
    image: pgvector/pgvector:pg16
    container_name: xlr8hire-postgres
    environment:
      POSTGRES_DB: xlr8hire
      POSTGRES_USER: xlr8hire
      POSTGRES_PASSWORD: xlr8hire
    ports:
      - "5432:5432"
    volumes:
      - xlr8hire_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xlr8hire -d xlr8hire"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  xlr8hire_pgdata:
