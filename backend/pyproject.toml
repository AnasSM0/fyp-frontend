[project]
name = "xlr8hire-backend"
version = "0.1.0"
description = "FastAPI backend foundation for XLR8Hire"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.17.2",
  "bcrypt==4.3.0",
  "email-validator==2.3.0",
  "fastapi==0.124.0",
  "httpx==0.28.1",
  "passlib[bcrypt]==1.7.4",
  "psycopg[binary]==3.3.2",
  "pydantic-settings==2.12.0",
  "pytest==9.0.1",
  "python-jose[cryptography]==3.5.0",
  "python-multipart==0.0.20",
  "SQLAlchemy==2.0.45",
  "uvicorn[standard]==0.38.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
